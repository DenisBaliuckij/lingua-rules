dimensions:
  number:
    values: [singular, dual, plural]
  case:
    values: [nominative, accusative, genitive, dative, instrumental, prepositional,
      locative, ablative, partitive, elative, adessive, allative, comitative]
  definiteness:
    values: [definite, indefinite]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future]
  mood:
    values: [indicative, imperative, conditional]
  possessor_person:
    values: [first, second, third]
  possessor_number:
    values: [singular, plural]
