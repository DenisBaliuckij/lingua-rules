dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive, dative, prepositional, ablative, vocative]
  gender:
    values: [masculine, feminine, neuter]
  definiteness:
    values: [definite, indefinite]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future, imperfect, preterite, perfect, pluperfect, future_perfect]
  mood:
    values: [indicative, subjunctive, imperative]
  aspect:
    values: [perfective, imperfective]
  verb_form:
    values: [participle, present_participle, past_participle]
  polarity:
    values: [affirmative]
