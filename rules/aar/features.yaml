dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive]
  gender:
    values: [masculine, feminine]
  definiteness:
    values: [indefinite]
  person:
    values: [first, second, third]
  tense:
    values: [present]
  mood:
    values: [indicative, subjunctive, imperative, optative]
  aspect:
    values: [perfective, imperfective]
  polarity:
    values: [affirmative, negative]
