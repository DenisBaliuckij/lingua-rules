dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, dative]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future]
  mood:
    values: [indicative, conditional, optative]
  aspect:
    values: [perfective, progressive]
  verb_form:
    values: [participle, present_participle, past_participle]
  formality:
    values: [formal]
