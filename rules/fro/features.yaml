dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, oblique]
  gender:
    values: [masculine, feminine]
  person:
    values: [first, second, third]
  tense:
    values: [present, future, imperfect, perfect]
  mood:
    values: [indicative, subjunctive]
  aspect:
    values: [perfective, progressive]
  verb_form:
    values: [participle, past_participle]
