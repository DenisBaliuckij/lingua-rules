dimensions:
  number:
    values: [singular, dual, plural]
  case:
    values: [nominative, accusative, genitive, locative, ablative, vocative, allative,
      comitative]
  gender:
    values: [masculine, feminine, common]
  person:
    values: [first, second, third]
