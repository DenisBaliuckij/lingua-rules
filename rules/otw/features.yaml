dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive]
  gender:
    values: [masculine, neuter]
  definiteness:
    values: [definite]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future, imperfect, future_perfect]
  mood:
    values: [indicative, subjunctive, potential]
  aspect:
    values: [perfective, imperfective]
  voice:
    values: [passive]
  verb_form:
    values: [present_participle, past_participle]
