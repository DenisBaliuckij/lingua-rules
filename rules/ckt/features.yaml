dimensions:
  number:
    values: [singular, dual, plural]
  case:
    values: [nominative, genitive, locative, ablative, essive, allative, comitative,
      ergative, absolutive]
  animacy:
    values: [animate, inanimate]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future]
  mood:
    values: [indicative, subjunctive, imperative]
