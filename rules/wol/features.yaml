dimensions:
  number:
    values: [singular, plural]
  definiteness:
    values: [definite]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future, imperfect, pluperfect, aorist, conditional_tense]
  mood:
    values: [indicative, subjunctive, imperative, conditional]
  verb_form:
    values: [infinitive, gerund]
  polarity:
    values: [affirmative, negative]
