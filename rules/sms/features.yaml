dimensions:
  number:
    values: [singular, dual, plural]
  case:
    values: [nominative, accusative, genitive, instrumental, locative, ablative, partitive,
      essive, illative, comitative, abessive]
  person:
    values: [first, second, third]
  tense:
    values: [present, past]
  mood:
    values: [indicative, imperative, conditional, potential]
  aspect:
    values: [perfective, progressive]
  voice:
    values: [passive]
  verb_form:
    values: [infinitive, participle, present_participle, past_participle, converb]
  polarity:
    values: [negative]
  possessor_person:
    values: [first, second, third]
  possessor_number:
    values: [singular, plural]
