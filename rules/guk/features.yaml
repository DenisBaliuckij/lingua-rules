dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, genitive, locative]
  definiteness:
    values: [definite]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future, imperfect]
  mood:
    values: [indicative, subjunctive, imperative]
  aspect:
    values: [perfective, imperfective, progressive]
  voice:
    values: [active]
