dimensions:
  number:
    values: [singular, plural]
  gender:
    values: [masculine, feminine]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future, imperfect, preterite, perfect, pluperfect, conditional_tense]
  mood:
    values: [indicative, subjunctive, imperative, conditional]
  aspect:
    values: [perfective, imperfective, progressive]
  verb_form:
    values: [infinitive, participle, present_participle, past_participle, gerund]
  polarity:
    values: [affirmative]
