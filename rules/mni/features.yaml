dimensions:
  number:
    values: [singular, dual, plural]
  case:
    values: [nominative, accusative, genitive, dative, instrumental, locative, ablative,
      comitative]
  person:
    values: [first, second, third]
  tense:
    values: [present, future, imperfect, perfect, aorist]
  mood:
    values: [indicative, imperative, optative]
  aspect:
    values: [perfective]
  verb_form:
    values: [participle, converb]
  polarity:
    values: [negative]
