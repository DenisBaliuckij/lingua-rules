dimensions:
  number:
    values: [singular, dual, plural]
  case:
    values: [nominative, genitive, ablative, partitive, essive, translative, inessive,
      elative, illative, adessive, allative]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, imperfect]
  mood:
    values: [indicative, imperative, conditional]
  aspect:
    values: [perfective, imperfective]
  voice:
    values: [passive]
  verb_form:
    values: [infinitive, participle, verbal_noun]
