dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive]
  gender:
    values: [masculine, feminine]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future, imperfect, perfect]
  mood:
    values: [indicative, subjunctive, imperative, conditional, potential]
  aspect:
    values: [perfective, progressive]
  verb_form:
    values: [infinitive, participle, present_participle, past_participle, gerund,
      converb]
