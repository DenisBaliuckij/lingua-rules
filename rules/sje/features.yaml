dimensions:
  number:
    values: [singular, dual, plural]
  case:
    values: [nominative, accusative, genitive, essive, inessive, elative, illative,
      comitative, abessive]
  person:
    values: [first, second, third]
  tense:
    values: [present, past]
  mood:
    values: [indicative, imperative, potential]
  aspect:
    values: [perfective, progressive]
  verb_form:
    values: [infinitive, participle, converb]
  polarity:
    values: [negative]
  degree:
    values: [positive, comparative, superlative]
