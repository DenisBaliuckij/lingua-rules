dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive, dative, instrumental, locative, essive,
      allative, comitative, ergative, oblique]
  tense:
    values: [present, past, future, imperfect, pluperfect]
  mood:
    values: [indicative, subjunctive, imperative, conditional, optative]
  aspect:
    values: [perfective, imperfective, progressive]
  verb_form:
    values: [infinitive, participle, present_participle, converb, verbal_noun]
  polarity:
    values: [affirmative, negative]
  degree:
    values: [comparative]
  evidentiality:
    values: [direct, indirect]
