dimensions:
  number:
    values: [singular, dual, plural]
  case:
    values: [nominative, accusative, genitive, dative, instrumental, locative, ablative,
      oblique]
  gender:
    values: [feminine]
  animacy:
    values: [animate]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future]
  mood:
    values: [indicative, imperative]
  aspect:
    values: [perfective, imperfective, progressive]
  voice:
    values: [passive]
  verb_form:
    values: [infinitive, participle, present_participle, past_participle, converb,
      verbal_noun]
  polarity:
    values: [negative]
