dimensions:
  number:
    values: [singular, dual, plural]
  case:
    values: [nominative, accusative, genitive, dative, instrumental, locative, ablative,
      comitative, ergative, absolutive]
  gender:
    values: [masculine, feminine]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future]
  aspect:
    values: [perfective, imperfective, habitual]
  voice:
    values: [active, middle]
  evidentiality:
    values: [direct, indirect]
