dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive, dative, instrumental, ablative]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future, imperfect, aorist]
  mood:
    values: [indicative, subjunctive, imperative, optative]
  voice:
    values: [passive]
  verb_form:
    values: [infinitive, participle, present_participle, past_participle]
  polarity:
    values: [affirmative, negative]
