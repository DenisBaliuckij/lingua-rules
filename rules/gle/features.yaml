dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, genitive, dative, vocative]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future, imperfect]
  mood:
    values: [indicative, subjunctive, imperative, conditional]
  aspect:
    values: [habitual]
  voice:
    values: [active]
  verb_form:
    values: [participle, past_participle, verbal_noun]
  polarity:
    values: [affirmative, negative]
  degree:
    values: [positive, comparative]
