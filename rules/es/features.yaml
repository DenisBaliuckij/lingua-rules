dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, dative, prepositional, comitative, direct]
  gender:
    values: [masculine, feminine, neuter]
  person:
    values: [first, second, third]
  tense:
    values: [present, future, imperfect, preterite, perfect, conditional_tense]
  mood:
    values: [indicative, subjunctive, imperative, conditional]
  aspect:
    values: [perfective]
  verb_form:
    values: [infinitive, participle, present_participle, past_participle, gerund]
  polarity:
    values: [affirmative, negative]
  formality:
    values: [informal, formal]
