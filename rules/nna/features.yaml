dimensions:
  number:
    values: [singular, dual, plural]
  case:
    values: [nominative, accusative, genitive, dative, locative, ablative, ergative,
      absolutive, oblique]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future]
  mood:
    values: [indicative, imperative, optative, potential]
  aspect:
    values: [perfective, imperfective]
  polarity:
    values: [affirmative]
  evidentiality:
    values: [indirect]
