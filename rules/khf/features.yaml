dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive, ablative, partitive, essive, translative,
      inessive, elative, illative, adessive, allative, abessive]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, perfect, pluperfect]
  mood:
    values: [indicative, imperative, conditional]
  voice:
    values: [passive]
  polarity:
    values: [affirmative, negative]
