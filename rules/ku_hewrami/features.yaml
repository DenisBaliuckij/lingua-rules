dimensions:
  number:
    values: [singular, plural]
  case:
    values: [oblique, direct]
  gender:
    values: [masculine, feminine]
  person:
    values: [first, second, third]
  tense:
    values: [present, past]
  mood:
    values: [indicative, subjunctive, imperative, conditional]
  aspect:
    values: [perfective, habitual]
  polarity:
    values: [affirmative, negative]
