dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, genitive, dative, instrumental, ablative, allative, ergative,
      absolutive, direct]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future, imperfect, perfect, pluperfect]
  mood:
    values: [indicative, subjunctive, conditional, optative]
  aspect:
    values: [perfective, progressive]
  evidentiality:
    values: [indirect]
