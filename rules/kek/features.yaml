dimensions:
  number:
    values: [singular, plural]
  definiteness:
    values: [definite]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future]
  mood:
    values: [indicative, subjunctive, imperative, optative]
  aspect:
    values: [perfective, imperfective, habitual]
  verb_form:
    values: [infinitive, past_participle]
