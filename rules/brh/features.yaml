dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive, dative, instrumental, locative, ablative,
      oblique]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future, imperfect, perfect, pluperfect, future_perfect]
  mood:
    values: [indicative, subjunctive, imperative, potential]
  verb_form:
    values: [infinitive, past_participle]
  polarity:
    values: [negative]
