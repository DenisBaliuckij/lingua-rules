dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive, dative, vocative]
  gender:
    values: [masculine, feminine, neuter]
  definiteness:
    values: [definite, indefinite]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, imperfect, aorist]
  mood:
    values: [indicative, imperative, conditional]
  aspect:
    values: [perfective, imperfective]
  voice:
    values: [passive, reflexive]
  verb_form:
    values: [participle]
