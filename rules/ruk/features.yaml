dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive, dative, ablative]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future, imperfect, preterite, perfect, conditional_tense]
  mood:
    values: [indicative, subjunctive, imperative, conditional]
  aspect:
    values: [perfective, imperfective, progressive]
  verb_form:
    values: [infinitive, participle, present_participle, past_participle]
