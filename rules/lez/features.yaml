dimensions:
  number:
    values: [singular, plural]
  case:
    values: [genitive, dative, locative, inessive, elative, adessive, allative, comitative,
      ergative, absolutive, oblique]
  tense:
    values: [present, past, future, perfect, aorist]
  mood:
    values: [indicative, imperative, optative]
  aspect:
    values: [perfective, imperfective]
  verb_form:
    values: [infinitive, participle, converb, verbal_noun]
  polarity:
    values: [affirmative, negative]
