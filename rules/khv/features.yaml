dimensions:
  number:
    values: [singular, dual, plural]
  case:
    values: [genitive, dative, instrumental, locative, ablative, inessive, adessive,
      allative, comitative, ergative, absolutive]
  person:
    values: [first, second]
  tense:
    values: [present]
  mood:
    values: [indicative, conditional]
  verb_form:
    values: [participle, converb, verbal_noun]
  polarity:
    values: [affirmative, negative]
  degree:
    values: [comparative, superlative]
