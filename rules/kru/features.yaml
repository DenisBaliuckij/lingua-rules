dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive, dative, instrumental, locative, ablative,
      vocative]
  gender:
    values: [masculine, feminine, neuter, common]
  animacy:
    values: [animate]
  definiteness:
    values: [definite, indefinite]
  person:
    values: [first, second, third]
  tense:
    values: [present, past]
  mood:
    values: [indicative, subjunctive, imperative]
