  number:
    values: [singular, plural]
  gender:
    values: [masculine, feminine, neuter]
  animacy:
    values: [animate, inanimate]
  person:
    values: [first, second, third]
  verb_form:
    values: [infinitive, present, future, past, imperative, participle, converb, finite]
  degree:
