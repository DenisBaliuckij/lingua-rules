dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive, dative, instrumental]
  gender:
    values: [masculine, feminine, neuter]
  person:
    values: [first, second, third]
  tense:
    values: [present, preterite]
  mood:
    values: [indicative, subjunctive, imperative]
  verb_form:
    values: [infinitive, present_participle, past_participle]
