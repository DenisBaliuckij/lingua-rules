dimensions:
  number:
    values: [singular, dual, plural]
  case:
    values: [nominative, accusative, dative, instrumental, locative, ablative, translative,
      allative]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future, perfect, pluperfect]
  mood:
    values: [indicative, subjunctive, imperative, conditional, optative]
  aspect:
    values: [perfective, imperfective, progressive]
  voice:
    values: [active, passive]
  possessor_person:
    values: [first, second, third]
  possessor_number:
    values: [singular, plural]
