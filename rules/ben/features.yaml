dimensions:
  number:
    values: [singular, dual, plural]
  case:
    values: [nominative, accusative, genitive, locative]
  definiteness:
    values: [definite]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future]
  mood:
    values: [indicative, imperative, conditional]
  aspect:
    values: [perfective, imperfective, progressive, habitual]
  verb_form:
    values: [participle, verbal_noun]
  polarity:
    values: [affirmative, negative]
  formality:
    values: [formal]
