dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, ergative, oblique]
  gender:
    values: [masculine, feminine]
  animacy:
    values: [animate, inanimate]
  person:
    values: [first, second, third]
  tense:
    values: [future]
  mood:
    values: [indicative, imperative]
