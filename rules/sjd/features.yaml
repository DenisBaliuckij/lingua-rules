dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive, locative, translative, allative, comitative,
      abessive]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, imperfect]
  mood:
    values: [indicative, imperative]
  polarity:
    values: [affirmative]
