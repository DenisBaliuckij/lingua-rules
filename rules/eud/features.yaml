dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive, dative, instrumental, locative, ablative,
      vocative, comitative]
  person:
    values: [first, second, third]
  tense:
    values: [present, future, imperfect, perfect, pluperfect]
  mood:
    values: [indicative, subjunctive]
  aspect:
    values: [perfective, progressive]
  voice:
    values: [active, passive]
  verb_form:
    values: [participle]
