dimensions:
  number:
    values: [singular, plural]
  case:
    values: [dative, instrumental, locative, comitative]
  definiteness:
    values: [definite]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, perfect, aorist]
  mood:
    values: [indicative, imperative]
  aspect:
    values: [perfective]
  verb_form:
    values: [infinitive, participle, present_participle]
  polarity:
    values: [affirmative, negative]
  possessor_person:
    values: [first, second, third]
  possessor_number:
    values: [singular]
