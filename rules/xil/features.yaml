dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative, genitive, dative, ablative, vocative]
  gender:
    values: [masculine, feminine, neuter]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future, imperfect, preterite, perfect, pluperfect]
  mood:
    values: [indicative, subjunctive, imperative, conditional]
  aspect:
    values: [perfective, imperfective]
  verb_form:
    values: [infinitive, participle, gerund]
