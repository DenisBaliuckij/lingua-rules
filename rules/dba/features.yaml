dimensions:
  number:
    values: [singular, plural]
  case:
    values: [nominative, accusative]
  definiteness:
    values: [definite, indefinite]
  person:
    values: [first, second, third]
  tense:
    values: [present, past, future]
  mood:
    values: [indicative, imperative, optative]
  aspect:
    values: [perfective, imperfective]
  polarity:
    values: [affirmative, negative]
