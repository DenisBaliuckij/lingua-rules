{% extends "base.html" %}
{% block content %}
<h1>Try it: {{ lang }} / {{ category }}</h1>
<form hx-post="/{{ lang }}/category/{{ category }}/try" hx-target="#result">
  <label>Lemma <input type="text" name="lemma"></label>
  {% for dimension, values in vocab.dimensions.items() %}
  <label>{{ dimension }}
    {# "not set" leaves the dimension out of the request, for categories that
       don't use every dimension the language declares #}
    <select name="{{ dimension }}">
      <option value="">— not set —</option>
      {% for value in values %}<option value="{{ value }}"{% if loop.first %} selected{% endif %}>{{ value }}</option>{% endfor %}
    </select>
  </label>
  {% endfor %}
  <button type="submit">Generate</button>
</form>
<div id="result"></div>
{% endblock %}
